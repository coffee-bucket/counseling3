<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 수시·정시 상담 관리</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --primary:#5b6cf8; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
  --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155;
  --gray-800:#1e293b; --gray-900:#0f172a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--gray-50);color:var(--gray-800);font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:13px;}
input,select,textarea{border:1px solid var(--gray-300);border-radius:5px;padding:5px 8px;font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;background:white;color:var(--gray-800);}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,108,248,.12);}
input[type="checkbox"]{width:14px;height:14px;accent-color:var(--primary);}
button{cursor:pointer;border:none;border-radius:5px;font-family:inherit;font-size:12px;transition:all .15s;}
button:hover{opacity:.88;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:99px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b6cf8,#8b5cf6);}
.card{background:white;border-radius:16px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,.18);}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:white;border:2px solid var(--gray-200);border-radius:8px;font-size:14px;font-weight:600;color:var(--gray-700);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.btn-primary{background:linear-gradient(135deg,#5b6cf8,#8b5cf6);color:white;font-weight:600;padding:11px 20px;}
.btn-success{background:var(--success);color:white;font-weight:600;padding:6px 14px;}
.btn-purple{background:#8b5cf6;color:white;font-weight:600;padding:6px 14px;}
.btn-ghost{background:var(--gray-100);color:var(--gray-700);padding:6px 12px;}
.btn-danger{background:none;color:var(--gray-300);padding:4px 6px;font-size:14px;}
.btn-danger:hover{color:var(--danger);}
.header{background:linear-gradient(135deg,#5b6cf8,#8b5cf6);color:white;padding:14px 24px;}
.toolbar{background:white;border-bottom:1px solid var(--gray-200);padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:20px 24px;max-width:1300px;margin:0 auto;}
.student-card{background:white;border-radius:10px;padding:14px;cursor:pointer;border:1px solid var(--gray-200);box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s;position:relative;}
.student-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.student-card.completed{border-color:#a7f3d0;border-width:2px;}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-green{background:#dcfce7;color:#15803d;} .badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-yellow{background:#fef9c3;color:#854d0e;} .badge-red{background:#fee2e2;color:#991b1b;}
.student-header{background:white;border-bottom:1px solid var(--gray-200);padding:10px 20px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;}
.section-box{background:white;border-radius:10px;padding:14px 16px;border:1px solid var(--gray-200);margin-bottom:10px;}
.section-title{font-weight:700;font-size:13px;color:var(--gray-700);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.field-label{font-size:11px;color:var(--gray-500);font-weight:500;margin-bottom:3px;}
.mini-label{font-size:10px;color:var(--gray-400);text-align:center;margin-bottom:2px;}
.susi-entry{border:1px solid var(--gray-200);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:white;}
.susi-entry.cat-4year{background:#fafbff;border-left:3px solid var(--primary);}
.susi-entry.cat-후보{background:#fffbeb;border-left:3px solid var(--warning);}
.susi-entry.cat-전문대{background:#f0fdf4;border-left:3px solid var(--success);}
.susi-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.result-block{background:var(--gray-50);border-radius:6px;padding:5px 8px;display:flex;gap:4px;align-items:center;}
.gun-header{display:inline-block;font-weight:700;font-size:12px;color:#4f46e5;background:#eef2ff;border-radius:5px;padding:3px 10px;margin-bottom:6px;}
.jungsi-row{display:flex;gap:5px;align-items:center;padding:5px 6px;background:var(--gray-50);border-radius:5px;border:1px solid var(--gray-100);margin-bottom:4px;}
.tab{padding:5px 14px;background:var(--gray-100);color:var(--gray-600);border-radius:5px;font-size:12px;}
.tab.active{background:var(--primary);color:white;font-weight:600;}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400);}

/* ── PRINT ── */
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white!important;font-family:'맑은 고딕','Malgun Gothic',sans-serif;font-size:10.5px;margin:0;padding:0;}
  .no-print,.student-header,.screen-content{display:none!important;}
  .print-area{display:block!important;padding:12mm 10mm;}

  .ph{text-align:center;border-bottom:2.5px solid #1e293b;margin-bottom:8px;padding-bottom:6px;}
  .ph h2{font-size:16px;font-weight:700;margin-bottom:2px;}
  .ph p{font-size:11px;color:#475569;}

  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #aaa;padding:3px 5px;font-size:10px;vertical-align:middle;}
  th{background:#e8ecff;font-weight:700;text-align:center;}

  .info-tbl td.lbl{background:#f0f4ff;font-weight:600;text-align:center;width:60px;}
  .grade-tbl td{text-align:center;} .grade-val{font-weight:700;font-size:13px;color:#2563eb;}

  .sec-title{font-size:12px;font-weight:700;margin:9px 0 4px;padding:3px 8px;background:#e8ecff;border-left:4px solid #5b6cf8;}

  .susi-tbl th{background:#f0f4ff;} .susi-tbl td.center{text-align:center;}
  .susi-tbl tr.cat-4year td{background:#fafbff;}
  .susi-tbl tr.cat-후보 td{background:#fffbeb;}
  .susi-tbl tr.cat-전문대 td{background:#f0fdf4;}

  .jungsi-tbl th{background:#eef2ff;} .jungsi-tbl td{text-align:center;}
  .gun-cell{font-weight:700;color:#4f46e5;background:#eef2ff;}

  .diff-안정{color:#15803d;font-weight:700;} .diff-적정{color:#1d4ed8;font-weight:700;}
  .diff-소신{color:#854d0e;font-weight:700;} .diff-도전{color:#991b1b;font-weight:700;}

  .print-footer{margin-top:10px;font-size:9px;color:#888;text-align:right;border-top:1px solid #ddd;padding-top:4px;}
}
.print-area{display:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
let db=null,auth=null;

function initFirebase(config){
  try{if(firebase.apps.length>0)firebase.apps.forEach(a=>a.delete());}catch(e){}
  firebase.initializeApp(config); db=firebase.firestore(); auth=firebase.auth();
}

const uid=()=>Math.random().toString(36).slice(2);
const defaultGrades=()=>({jeonGwaGyo:'',guksuYeongSa:'',guksuYeongGwa:'',tanAvg:'',
  suneungGrad:{guk:'',su:'',yeong:'',tan1:'',tan2:''},suneungPct:{guk:'',su:'',tan1:'',tan2:''}});
const defRes=yr=>({year:yr,rate:'',chungwon:'',avg:'',cut70:''});
const defSusi=()=>({id:uid(),category:'4년제',univ:'',jType:'교과',jName:'',major:'',capacity:'',
  ratio:{naesin:'',seoryu:'',myeon:'',gita:''},results:[defRes('25'),defRes('24'),defRes('23')],
  suneungMin:'',difficulty:'',schedule:{apply:'',step1:'',interview:'',final:''},note:''});
const defJ=(gun,no)=>({id:uid(),gun,no,univ:'',major:'',result2026:'',result2025:'',difficulty:'',note:''});
const defStudent=no=>({no,studentNumber:'',name:'',susiMemo:'',jungsiMemo:'',specialNote:'',
  counselingDate:'',completed:false,grades:defaultGrades(),
  susiList:[defSusi(),defSusi(),defSusi()],
  jungsiList:[defJ('가',1),defJ('가',2),defJ('가',3),defJ('나',1),defJ('나',2),defJ('나',3),defJ('다',1),defJ('다',2),defJ('다',3)]});

/* Config */
function ConfigScreen({onSave}){
  const [raw,setRaw]=useState('');const [err,setErr]=useState('');
  const handle=()=>{
    try{const p=JSON.parse(raw);if(!p.apiKey||!p.projectId)throw new Error('apiKey/projectId 없음');
      localStorage.setItem('fbConfig',JSON.stringify(p));onSave(p);}
    catch(e){setErr('올바른 JSON이 아닙니다: '+e.message);}};
  return(<div className="center-screen"><div className="card" style={{width:540}}>
    <div style={{fontSize:36,marginBottom:8}}>🎓</div>
    <h1 style={{fontSize:20,fontWeight:700,marginBottom:4}}>수시·정시 상담 관리</h1>
    <p style={{color:'var(--gray-500)',fontSize:13,marginBottom:20}}>Firebase 설정을 입력하세요</p>
    <div style={{background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:8,padding:12,marginBottom:14,fontSize:12,color:'#0369a1',lineHeight:1.7}}>
      Firebase Console → 프로젝트 설정 → 웹앱 → <strong>firebaseConfig 객체 전체</strong> 복사 후 붙여넣기
    </div>
    <textarea value={raw} onChange={e=>setRaw(e.target.value)}
      placeholder={'{\n  "apiKey": "AIzaSy...",\n  "authDomain": "...",\n  "projectId": "...",\n  ...\n}'}
      style={{width:'100%',height:170,fontFamily:'monospace',fontSize:11,resize:'vertical',marginBottom:10}}/>
    {err&&<p style={{color:'var(--danger)',fontSize:12,marginBottom:10}}>⚠ {err}</p>}
    <button className="btn-primary" onClick={handle} style={{width:'100%',borderRadius:8,fontSize:14}}>설정 저장 및 시작 →</button>
  </div></div>);}

/* Login */
function LoginScreen(){
  const [loading,setLoading]=useState(false);
  const login=async()=>{setLoading(true);
    try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
    catch(e){alert('로그인 실패: '+e.message);setLoading(false);}};
  return(<div className="center-screen"><div className="card" style={{width:380,textAlign:'center'}}>
    <div style={{fontSize:48,marginBottom:12}}>🎓</div>
    <h1 style={{fontSize:22,fontWeight:700,marginBottom:6}}>수시·정시 상담 관리</h1>
    <p style={{color:'var(--gray-500)',fontSize:13,marginBottom:28}}>양주백석고등학교 진로진학상담실</p>
    <button className="btn-google" onClick={login} disabled={loading}>
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      {loading?'로그인 중...':'Google 계정으로 로그인'}
    </button>
    <p style={{fontSize:11,color:'var(--gray-400)',marginTop:16}}>교사별 개인 데이터로 분리 저장됩니다</p>
  </div></div>);}

/* GradeSection */
function GradeSection({grades,onChange}){
  const g=grades||defaultGrades();
  const set=(k,v)=>onChange({...g,[k]:v});
  const setN=(obj,k,v)=>onChange({...g,[obj]:{...g[obj],[k]:v}});
  const GI=({field,label})=>(<div style={{flex:1,minWidth:60}}>
    <div className="mini-label">{label}</div>
    <input value={g[field]||''} onChange={e=>set(field,e.target.value)}
      style={{width:'100%',textAlign:'center',background:'#fef9c3',fontWeight:700,fontSize:15,padding:'5px 2px'}}/>
  </div>);
  const SI=({obj,k,label,w})=>(<div style={{textAlign:'center'}}>
    <div className="mini-label">{label}</div>
    <input value={g[obj]?.[k]||''} onChange={e=>setN(obj,k,e.target.value)}
      style={{width:w||44,textAlign:'center',fontSize:12,padding:'4px 2px'}}/>
  </div>);
  return(<div className="section-box">
    <div className="section-title">📊 내신 및 수능 성적</div>
    <div style={{display:'flex',gap:6,marginBottom:12}}>
      <GI field="jeonGwaGyo" label="전교과"/><GI field="guksuYeongSa" label="국수영사"/>
      <GI field="guksuYeongGwa" label="국수영과"/><GI field="tanAvg" label="탐구평균"/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <div><div style={{fontSize:11,color:'var(--gray-500)',fontWeight:600,marginBottom:6}}>수능 등급</div>
        <div style={{display:'flex',gap:4}}>
          {[['guk','국'],['su','수'],['yeong','영'],['tan1','탐1'],['tan2','탐2']].map(([k,l])=><SI key={k} obj="suneungGrad" k={k} label={l} w={38}/>)}
        </div></div>
      <div><div style={{fontSize:11,color:'var(--gray-500)',fontWeight:600,marginBottom:6}}>수능 백분위</div>
        <div style={{display:'flex',gap:4}}>
          {[['guk','국'],['su','수'],['tan1','탐1'],['tan2','탐2']].map(([k,l])=><SI key={k} obj="suneungPct" k={k} label={l} w={44}/>)}
        </div></div>
    </div>
  </div>);}

/* SusiEntryRow */
function SusiEntryRow({entry,onChange,onDelete}){
  const set=(k,v)=>onChange({...entry,[k]:v});
  const setR=(k,v)=>onChange({...entry,ratio:{...entry.ratio,[k]:v}});
  const setSc=(k,v)=>onChange({...entry,schedule:{...entry.schedule,[k]:v}});
  const setRes=(i,k,v)=>{const r=[...entry.results];r[i]={...r[i],[k]:v};onChange({...entry,results:r});};
  const cat=entry.category==='후보'?'susi-entry cat-후보':entry.category==='전문대'?'susi-entry cat-전문대':'susi-entry cat-4year';
  return(<div className={cat}>
    <div className="susi-row">
      <select value={entry.category} onChange={e=>set('category',e.target.value)} style={{width:64,fontWeight:600,fontSize:11}}>
        {['4년제','후보','전문대'].map(c=><option key={c}>{c}</option>)}
      </select>
      <input value={entry.univ||''} onChange={e=>set('univ',e.target.value)} placeholder="대학명" style={{flex:1.5,minWidth:90}}/>
      <select value={entry.jType||'교과'} onChange={e=>set('jType',e.target.value)} style={{width:56,fontSize:11}}>
        {['교과','종합','논술','실기','기타'].map(t=><option key={t}>{t}</option>)}
      </select>
      <input value={entry.jName||''} onChange={e=>set('jName',e.target.value)} placeholder="전형명" style={{flex:1.5,minWidth:90}}/>
      <input value={entry.major||''} onChange={e=>set('major',e.target.value)} placeholder="학과명" style={{flex:2,minWidth:90}}/>
      <input value={entry.capacity||''} onChange={e=>set('capacity',e.target.value)} placeholder="인원" style={{width:44,textAlign:'center'}}/>
      <button className="btn-danger" onClick={onDelete}>✕</button>
    </div>
    <div className="susi-row" style={{marginBottom:4}}>
      <span style={{fontSize:11,color:'var(--gray-500)',whiteSpace:'nowrap',fontWeight:600}}>전형요소</span>
      {[['내신','naesin'],['서류','seoryu'],['면접','myeon'],['기타','gita']].map(([l,k])=>(
        <div key={k} style={{textAlign:'center'}}><div className="mini-label">{l}%</div>
          <input value={entry.ratio?.[k]||''} onChange={e=>setR(k,e.target.value)} style={{width:40,textAlign:'center',fontSize:11}}/>
        </div>))}
      <div style={{display:'flex',alignItems:'center',gap:4,marginLeft:6}}>
        <span style={{fontSize:11,color:'var(--gray-500)',fontWeight:600}}>수능최저</span>
        <input value={entry.suneungMin||''} onChange={e=>set('suneungMin',e.target.value)} placeholder="예) 2합4" style={{width:90}}/>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:4,marginLeft:4}}>
        <span style={{fontSize:11,color:'var(--gray-500)',fontWeight:600}}>난이도</span>
        <select value={entry.difficulty||''} onChange={e=>set('difficulty',e.target.value)} style={{width:68,fontSize:11}}>
          <option value="">-</option><option>안정</option><option>적정</option><option>소신</option><option>도전</option>
        </select>
      </div>
    </div>
    <div className="susi-row" style={{marginBottom:4}}>
      <span style={{fontSize:11,color:'var(--gray-500)',whiteSpace:'nowrap',fontWeight:600}}>입시결과</span>
      {(entry.results||[]).map((r,i)=>(
        <div key={i} className="result-block">
          <span style={{fontSize:11,fontWeight:700,color:'var(--gray-600)',marginRight:2}}>{r.year}년</span>
          {[['경쟁률','rate',46],['충원','chungwon',38],['평균','avg',42],['70%','cut70',42]].map(([l,k,w])=>(
            <div key={k} style={{textAlign:'center'}}><div className="mini-label">{l}</div>
              <input value={r[k]||''} onChange={e=>setRes(i,k,e.target.value)} style={{width:w,textAlign:'center',fontSize:11,padding:'3px 2px'}}/>
            </div>))}
        </div>))}
    </div>
    <div className="susi-row" style={{marginBottom:4}}>
      <span style={{fontSize:11,color:'var(--gray-500)',whiteSpace:'nowrap',fontWeight:600}}>전형일정</span>
      {[['원서접수','apply'],['1단계발표','step1'],['면접일','interview'],['최종발표','final']].map(([l,k])=>(
        <div key={k} style={{flex:1,minWidth:100}}><div className="mini-label">{l}</div>
          <input type="date" value={entry.schedule?.[k]||''} onChange={e=>setSc(k,e.target.value)} style={{width:'100%',fontSize:11}}/>
        </div>))}
    </div>
    <div className="susi-row" style={{marginBottom:0}}>
      <span style={{fontSize:11,color:'var(--gray-500)',whiteSpace:'nowrap',fontWeight:600}}>비고/판단</span>
      <input value={entry.note||''} onChange={e=>set('note',e.target.value)} placeholder="특이사항, 판단 메모..." style={{flex:1}}/>
    </div>
  </div>);}

/* JungsiSection */
function JungsiSection({jungsiList,onChange}){
  const update=(idx,e)=>{const n=[...jungsiList];n[idx]=e;onChange(n);};
  return(<div className="section-box">
    <div className="section-title">📋 정시 지원 계획</div>
    {['가','나','다'].map(gun=>(<div key={gun} style={{marginBottom:14}}>
      <div className="gun-header">{gun}군</div>
      {jungsiList.map((e,idx)=>e.gun!==gun?null:(
        <div key={e.id} className="jungsi-row">
          <span style={{fontSize:11,color:'var(--gray-400)',width:16,flexShrink:0,fontWeight:600}}>{e.no}</span>
          <input value={e.univ||''} onChange={ev=>update(idx,{...e,univ:ev.target.value})} placeholder="대학명" style={{flex:1.2,minWidth:80}}/>
          <input value={e.major||''} onChange={ev=>update(idx,{...e,major:ev.target.value})} placeholder="모집단위(학과)" style={{flex:2,minWidth:100}}/>
          <div style={{textAlign:'center'}}><div className="mini-label">26입결</div>

          <select value={e.difficulty||''} onChange={ev=>update(idx,{...e,difficulty:ev.target.value})} style={{width:62,fontSize:11}}>

/* StudentScreen */
function StudentScreen({student,onSave,onBack,classInfo}){
  const [data,setData]=useState(student);
  const [saving,setSaving]=useState(false);
  const [status,setStatus]=useState('idle');

  useEffect(()=>{setData(student);setStatus('idle');},[student.id]);

  const update=(k,v)=>setData(p=>({...p,[k]:v}));

  const handleSave=async()=>{
    setSaving(true);setStatus('saving');
    try{await onSave(data);setStatus('saved');setTimeout(()=>setStatus('idle'),2500);}
    catch(e){setStatus('error');alert('저장 실패: '+e.message);}
    finally{setSaving(false);}};

  const updateSusi=(idx,e)=>setData(d=>{const l=[...d.susiList];l[idx]=e;return{...d,susiList:l};});
  const deleteSusi=idx=>setData(d=>({...d,susiList:d.susiList.filter((_,i)=>i!==idx)}));
  const addSusi=()=>setData(d=>({...d,susiList:[...(d.susiList||[]),defSusi()]}));

  const btnStyle={
    idle:{label:'💾 저장',bg:'#3b82f6'},
    saving:{label:'저장 중...',bg:'#94a3b8'},
    saved:{label:'✓ 저장 완료',bg:'#10b981'},
    error:{label:'⚠ 저장 실패',bg:'#ef4444'},
  }[status];

  return(<div style={{minHeight:'100vh',background:'var(--gray-50)'}}>
    <div className="student-header no-print">
      <button className="btn-ghost" onClick={onBack}>← 목록으로</button>
      <div>
        <span style={{fontSize:15,fontWeight:700,color:'var(--gray-900)'}}>{data.name||'이름 없음'}</span>
        <span style={{fontSize:12,color:'var(--gray-500)',marginLeft:8}}>학번 {data.studentNumber||'—'}</span>
      </div>
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
        <button onClick={()=>window.print()}
          style={{background:'#0f766e',color:'white',fontWeight:600,padding:'7px 16px',fontSize:12,borderRadius:6}}>
          🖨️ 인쇄
        </button>
        <button onClick={handleSave} disabled={saving}
          style={{fontWeight:700,padding:'7px 22px',fontSize:13,borderRadius:6,background:btnStyle.bg,color:'white'}}>
          {btnStyle.label}
        </button>
      </div>
    </div>

    <div className="screen-content" style={{maxWidth:1100,margin:'0 auto',padding:'16px 20px'}}>
      <div className="section-box" style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        {[['번호','no',50],['학번','studentNumber',90],['이름','name',90]].map(([l,k,w])=>(
          <div key={k}><div className="field-label">{l}</div>
            <input value={data[k]||''} onChange={e=>update(k,e.target.value)} style={{width:w}}/></div>))}
        <div><div className="field-label">상담일자</div>
          <input type="date" value={data.counselingDate||''} onChange={e=>update('counselingDate',e.target.value)}/></div>
        <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,fontWeight:600,
          color:data.completed?'var(--success)':'var(--gray-500)',cursor:'pointer',alignSelf:'flex-end',paddingBottom:5}}>
          <input type="checkbox" checked={!!data.completed} onChange={e=>update('completed',e.target.checked)}/>
          상담 완료
        </label>
        <div style={{flex:1,minWidth:120}}><div className="field-label">수시 메모</div>
          <input value={data.susiMemo||''} onChange={e=>update('susiMemo',e.target.value)} placeholder="수시 메모..." style={{width:'100%'}}/></div>
        <div style={{flex:1,minWidth:120}}><div className="field-label">정시 메모</div>
          <input value={data.jungsiMemo||''} onChange={e=>update('jungsiMemo',e.target.value)} placeholder="정시 메모..." style={{width:'100%'}}/></div>
        <div style={{flex:1.5,minWidth:140}}><div className="field-label">특이사항</div>
          <input value={data.specialNote||''} onChange={e=>update('specialNote',e.target.value)} placeholder="특이사항..." style={{width:'100%'}}/></div>
      </div>

      <GradeSection grades={data.grades} onChange={g=>setData(d=>({...d,grades:g}))}/>

      <div className="section-box">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div className="section-title" style={{marginBottom:0}}>🏫 수시 지원 계획</div>
          <button className="btn-success" onClick={addSusi}>+ 항목 추가</button>
        </div>
        {(data.susiList||[]).length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--gray-400)'}}>항목 추가 버튼을 눌러 수시 지원 대학을 등록하세요</div>}
        {(data.susiList||[]).map((e,idx)=><SusiEntryRow key={e.id||idx} entry={e} onChange={en=>updateSusi(idx,en)} onDelete={()=>deleteSusi(idx)}/>)}
      </div>

      <JungsiSection jungsiList={data.jungsiList||[]} onChange={v=>setData(d=>({...d,jungsiList:v}))}/>
    </div>

    <PrintView data={data} classInfo={classInfo}/>
  </div>);}

/* Dashboard */
function Dashboard({user,onLogout}){
  const [students,setStudents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [classInfo,setClassInfo]=useState({grade:'3학년',cls:'1반',teacher:''});
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('전체');

  const userRef=useCallback(()=>db.collection('teachers').doc(user.uid),[user.uid]);

  useEffect(()=>{
    const unsub=userRef().collection('students').orderBy('no').onSnapshot(snap=>{
      setStudents(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);
    },err=>{console.error(err);setLoading(false);});
    userRef().get().then(doc=>{if(doc.exists&&doc.data()?.classInfo)setClassInfo(doc.data().classInfo);});
    return()=>unsub();
  },[user.uid]);

  const addStudents=async count=>{
    if(count<=0||count>50)return;
    const batch=db.batch();const base=students.length;
    for(let i=0;i<count;i++){const ref=userRef().collection('students').doc();
      batch.set(ref,{...defStudent(base+i+1),createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
    await batch.commit();};

  const saveStudent=async s=>{
    const{id,...data}=s;
    await userRef().collection('students').doc(id).set(
      {...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    setStudents(prev=>prev.map(st=>st.id===id?{id,...data}:st));};

  const deleteStudent=async(id,e)=>{
    e.stopPropagation();
    if(!window.confirm('이 학생 데이터를 삭제하시겠습니까?'))return;
    await userRef().collection('students').doc(id).delete();};

  const saveClassInfo=info=>{setClassInfo(info);userRef().set({classInfo:info},{merge:true});};

  if(selected){
    const live=students.find(s=>s.id===selected.id)||selected;
    return<StudentScreen student={live} onSave={saveStudent} onBack={()=>setSelected(null)} classInfo={classInfo}/>;
  }

  const filtered=students.filter(s=>{
    const q=search.trim();
    if(q&&!s.name?.includes(q)&&!s.studentNumber?.includes(q))return false;
    if(filter==='완료')return!!s.completed;if(filter==='미완료')return!s.completed;return true;});
  const done=students.filter(s=>s.completed).length;
  const pct=students.length>0?Math.round(done/students.length*100):0;

  return(<div style={{minHeight:'100vh',background:'var(--gray-50)'}}>
    <div className="header"><div style={{maxWidth:1300,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <h1 style={{fontSize:18,fontWeight:700}}>🎓 수시·정시 상담 관리</h1>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:12,opacity:.85}}>{user.displayName}</span>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.2)',color:'white',padding:'5px 12px',fontSize:12}}>로그아웃</button>
        </div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        {[['grade','학년',60],['cls','반',52],['teacher','담임교사',100]].map(([k,l,w])=>(
          <input key={k} value={classInfo[k]||''} onChange={e=>saveClassInfo({...classInfo,[k]:e.target.value})}
            placeholder={l} style={{width:w,background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',color:'white',padding:'5px 10px',borderRadius:5,fontSize:13}}/>))}
        <div style={{marginLeft:12,fontSize:13,opacity:.9,display:'flex',gap:10}}>
          <span>전체 {students.length}명</span><span>·</span><span>완료 {done}명 ({pct}%)</span>
        </div>
        <div style={{flex:1,maxWidth:200,height:6,background:'rgba(255,255,255,.3)',borderRadius:99,overflow:'hidden',marginLeft:8}}>
          <div style={{height:'100%',width:`${pct}%`,background:'#a7f3d0',borderRadius:99,transition:'width .4s'}}/>
        </div>
      </div>
    </div></div>

    <div className="toolbar">
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 이름 또는 학번 검색" style={{width:200}}/>
      <div style={{display:'flex',gap:4}}>
        {['전체','완료','미완료'].map(f=><button key={f} className={`tab ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>)}
      </div>
      <div style={{marginLeft:'auto',display:'flex',gap:6}}>
        <button className="btn-success" onClick={()=>addStudents(1)}>+ 1명</button>
        <button className="btn-purple" onClick={()=>{const n=parseInt(window.prompt('몇 명 추가? (최대 50)','30'));if(!isNaN(n)&&n>0)addStudents(Math.min(n,50));}}>+ 일괄 추가</button>
      </div>
    </div>

    {loading?(<div className="empty-state"><div style={{fontSize:32,marginBottom:8}}>⏳</div>불러오는 중...</div>)
    :filtered.length===0&&students.length===0?(<div className="empty-state">
      <div style={{fontSize:48,marginBottom:12}}>📋</div>
      <p style={{fontSize:15,marginBottom:6,fontWeight:600}}>학생이 없습니다</p>
      <p style={{fontSize:13,marginBottom:20,color:'var(--gray-400)'}}>버튼을 눌러 학생을 추가하세요</p>
      <button className="btn-primary" onClick={()=>addStudents(30)} style={{borderRadius:8,fontSize:14,padding:'10px 24px'}}>30명 일괄 추가</button>
    </div>)
    :filtered.length===0?(<div className="empty-state">검색 결과가 없습니다</div>)
    :(<div className="student-grid">{filtered.map(s=>{
      const sc=(s.susiList||[]).filter(e=>e.univ).length;
      const jc=(s.jungsiList||[]).filter(e=>e.univ).length;
      return(<div key={s.id} className={`student-card ${s.completed?'completed':''}`} onClick={()=>setSelected(s)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
          <div>
            <span style={{fontSize:11,color:'var(--gray-400)',display:'block'}}>{s.no}번 · {s.studentNumber||'학번 없음'}</span>
            <span style={{fontSize:16,fontWeight:700,color:'var(--gray-900)'}}>{s.name||'—'}</span>
          </div>
          {s.completed&&<span className="badge badge-green">완료</span>}
        </div>
        {s.grades?.jeonGwaGyo?(
          <div style={{display:'flex',gap:4,marginBottom:8}}>
            {[['전교',s.grades?.jeonGwaGyo],['국수영사',s.grades?.guksuYeongSa]].map(([l,v])=>(
              <div key={l} style={{flex:1,background:'var(--gray-50)',borderRadius:5,padding:'4px 0',textAlign:'center'}}>
                <div style={{fontSize:10,color:'var(--gray-400)'}}>{l}</div>
                <div style={{fontSize:14,fontWeight:700,color:'var(--primary)'}}>{v||'-'}</div>
              </div>))}
            <div style={{flex:1,background:'var(--gray-50)',borderRadius:5,padding:'4px 0',textAlign:'center'}}>
              <div style={{fontSize:10,color:'var(--gray-400)'}}>수시</div>
              <div style={{fontSize:13,fontWeight:700,color:'#8b5cf6'}}>{sc}개</div>
            </div>
            {jc>0&&<div style={{flex:1,background:'var(--gray-50)',borderRadius:5,padding:'4px 0',textAlign:'center'}}>
              <div style={{fontSize:10,color:'var(--gray-400)'}}>정시</div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--success)'}}>{jc}개</div>
            </div>}
          </div>
        ):<div style={{fontSize:11,color:'var(--gray-300)',marginBottom:8,padding:'6px',textAlign:'center',background:'var(--gray-50)',borderRadius:5}}>성적 미입력</div>}
        {s.susiMemo&&<p style={{fontSize:11,color:'var(--gray-500)',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📝 {s.susiMemo}</p>}
        {s.counselingDate&&<p style={{fontSize:11,color:'var(--gray-400)'}}>📅 {s.counselingDate}</p>}
        <button style={{position:'absolute',bottom:8,right:8,background:'none',border:'none',color:'var(--gray-200)',fontSize:14,padding:'2px 4px',cursor:'pointer',transition:'color .15s'}}
          onClick={e=>deleteStudent(s.id,e)}
          onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
          onMouseLeave={e=>e.currentTarget.style.color='var(--gray-200)'}>🗑</button>
      </div>);})}
    </div>)}
  </div>);}

/* App Root */
function App(){
  const [screen,setScreen]=useState('loading');const [user,setUser]=useState(null);
  useEffect(()=>{
    const saved=localStorage.getItem('fbConfig');
    if(saved){try{initFirebase(JSON.parse(saved));
      const unsub=auth.onAuthStateChanged(u=>{setUser(u);setScreen(u?'dashboard':'login');});
      return()=>unsub();}catch(e){localStorage.removeItem('fbConfig');setScreen('config');}}
    else setScreen('config');
  },[]);
  const handleConfig=config=>{initFirebase(config);auth.onAuthStateChanged(u=>{setUser(u);setScreen(u?'dashboard':'login');});};
  if(screen==='loading')return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--gray-400)',fontSize:15}}>🎓 로딩 중...</div>;
  if(screen==='config')return<ConfigScreen onSave={handleConfig}/>;
  if(screen==='login'||!user)return<LoginScreen/>;
  return<Dashboard user={user} onLogout={()=>{auth.signOut();setScreen('login');setUser(null);}}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
