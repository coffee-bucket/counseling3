<style>
:root{--primary:#5b6cf8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--gray-50);color:var(--gray-800);font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:13px;}
input,select,textarea{border:1px solid var(--gray-300);border-radius:5px;padding:5px 8px;font-size:12px;outline:none;transition:border-color .15s;font-family:inherit;background:white;color:var(--gray-800);}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,108,248,.12);}
input[type="checkbox"]{width:14px;height:14px;accent-color:var(--primary);}
button{cursor:pointer;border:none;border-radius:5px;font-family:inherit;font-size:12px;transition:all .15s;}
button:hover{opacity:.88;} button:disabled{opacity:.5;cursor:not-allowed;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:99px;}

.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b6cf8,#8b5cf6);}
.card{background:white;border-radius:16px;padding:36px;box-shadow:0 25px 60px rgba(0,0,0,.18);}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:white;border:2px solid var(--gray-200);border-radius:8px;font-size:14px;font-weight:600;color:var(--gray-700);}
.btn-primary{background:linear-gradient(135deg,#5b6cf8,#8b5cf6);color:white;font-weight:600;padding:11px 20px;}
.btn-success{background:var(--success);color:white;font-weight:600;padding:6px 14px;}
.btn-ghost{background:var(--gray-100);color:var(--gray-700);padding:6px 12px;}
.btn-teal{background:#0f766e;color:white;font-weight:600;padding:7px 16px;font-size:12px;}

/* Class switcher */
.cls-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.cls-tab{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);cursor:pointer;border:none;transition:all .15s;}
.cls-tab:hover{background:rgba(255,255,255,.25);color:white;}
.cls-tab.active{background:white;color:var(--primary);}

.header{background:linear-gradient(135deg,#5b6cf8,#8b5cf6);color:white;padding:12px 24px;}
.toolbar{background:white;border-bottom:1px solid var(--gray-200);padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:16px 24px;max-width:1300px;margin:0 auto;}
.student-card{background:white;border-radius:10px;padding:12px;cursor:pointer;border:1px solid var(--gray-200);box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s;position:relative;}
.student-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.student-card.completed{border-color:#a7f3d0;border-width:2px;}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-green{background:#dcfce7;color:#15803d;} .badge-blue{background:#dbeafe;color:#1d4ed8;} .badge-gray{background:var(--gray-100);color:var(--gray-400);}

.detail-header{background:white;border-bottom:1px solid var(--gray-200);padding:10px 20px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;}
.section-box{background:white;border-radius:10px;padding:14px 16px;border:1px solid var(--gray-200);margin-bottom:10px;}
.section-title{font-weight:700;font-size:13px;color:var(--gray-700);margin-bottom:10px;}
.field-label{font-size:11px;color:var(--gray-500);font-weight:500;margin-bottom:3px;}
.mini-label{font-size:10px;color:var(--gray-400);text-align:center;margin-bottom:2px;}

.susi-entry{border:1px solid var(--gray-200);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.susi-entry.cat-4year{background:#fafbff;border-left:3px solid var(--primary);}
.susi-entry.cat-전문대{background:#f0fdf4;border-left:3px solid var(--success);}
.susi-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.result-block{background:var(--gray-50);border-radius:6px;padding:5px 8px;display:flex;gap:4px;align-items:center;}
.gun-header{display:inline-block;font-weight:700;font-size:12px;color:#4f46e5;background:#eef2ff;border-radius:5px;padding:3px 10px;margin-bottom:6px;}
.jungsi-row{display:flex;gap:5px;align-items:center;padding:5px 6px;background:var(--gray-50);border-radius:5px;border:1px solid var(--gray-100);margin-bottom:4px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:white;border-radius:14px;padding:28px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.tab{padding:5px 14px;background:var(--gray-100);color:var(--gray-600);border-radius:5px;font-size:12px;}
.tab.active{background:var(--primary);color:white;font-weight:600;}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400);}
.progress-bar{height:8px;background:var(--gray-200);border-radius:99px;overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;background:var(--success);border-radius:99px;transition:width .3s;}

@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white!important;}
  .no-print,.detail-header,.screen-content{display:none!important;}
  .print-area{display:block!important;padding:12mm 10mm;}
  .ph{text-align:center;border-bottom:2.5px solid #1e293b;margin-bottom:8px;padding-bottom:6px;}
  .ph h2{font-size:16px;font-weight:700;margin-bottom:2px;} .ph p{font-size:11px;color:#475569;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #aaa;padding:3px 5px;font-size:10px;vertical-align:middle;}
  th{background:#e8ecff;font-weight:700;text-align:center;}
  .info-tbl td.lbl{background:#f0f4ff;font-weight:600;text-align:center;width:60px;}
  .grade-tbl td{text-align:center;} .grade-val{font-weight:700;font-size:13px;color:#2563eb;}
  .sec-title{font-size:12px;font-weight:700;margin:9px 0 4px;padding:3px 8px;background:#e8ecff;border-left:4px solid #5b6cf8;}
  .susi-tbl th{background:#f0f4ff;} .susi-tbl td.center{text-align:center;}
  .susi-tbl tr.cat-4year td{background:#fafbff;} .susi-tbl tr.cat-전문대 td{background:#f0fdf4;}
  .jungsi-tbl th{background:#eef2ff;} .jungsi-tbl td{text-align:center;}
  .gun-cell{font-weight:700;color:#4f46e5;background:#eef2ff;}
  .diff-상향{color:#991b1b;font-weight:700;} .diff-소신{color:#854d0e;font-weight:700;}
  .diff-적정{color:#1d4ed8;font-weight:700;} .diff-안정{color:#15803d;font-weight:700;} .diff-하향{color:#6b21a8;font-weight:700;}
  .print-footer{margin-top:10px;font-size:9px;color:#888;text-align:right;border-top:1px solid #ddd;padding-top:4px;}
}
.print-area{display:none;}
</style>

/* ── print helper ── */
const openPrintWindow=(cards,cls)=>{
  const APP_URL='coffee-bucket.github.io/counseling';
  if(cards.length===0){alert('인쇄할 계정 카드가 없습니다.');return;}
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>계정카드 ${cls}반</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;padding:8mm;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm;}
.card{border:1.5px dashed #999;border-radius:6px;padding:10px 12px;break-inside:avoid;page-break-inside:avoid;}
.school{font-size:9px;color:#555;margin-bottom:2px;}.cls{font-size:10px;color:#555;margin-bottom:4px;}
.name{font-size:19px;font-weight:700;margin-bottom:6px;color:#111;}
hr{border:none;border-top:1px dashed #ccc;margin:6px 0;}.url{font-size:9px;color:#555;margin-bottom:5px;}
.row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}.lbl{font-size:9px;color:#555;width:52px;}
.val{font-size:12px;font-weight:700;font-family:monospace;letter-spacing:1px;}
.pw{font-size:17px;font-weight:700;font-family:monospace;color:#1d4ed8;letter-spacing:3px;}
.note{font-size:8px;color:#aaa;margin-top:4px;}@page{margin:0;}
</style></head><body><div class="grid">
${cards.map(s=>`<div class="card"><div class="school">🎓 양주백석고 3학년부</div><div class="cls">3학년 ${cls}반 · ${s.no}번</div><div class="name">${s.name}</div><hr/><div class="url">🌐 ${APP_URL}</div><div class="row"><span class="lbl">아이디(학번)</span><span class="val">${s.studentNumber}</span></div><div class="row"><span class="lbl">비밀번호</span><span class="pw">${s.pw||'—'}</span></div><div class="note">* 비밀번호는 안전한 곳에 보관하세요</div></div>`).join('')}
</div><script>window.onload=()=>{window.print();}<\/script></body></html>`;
  const w=window.open('','_blank','width=900,height=700');
  if(w){w.document.write(html);w.document.close();}
  else alert('팝업 차단됨. 주소창 옆 팝업 허용 후 다시 시도하세요.');};

/* ── Config Screen ── */
function ConfigScreen({onSave}){
  const [raw,setRaw]=useState('');const [err,setErr]=useState('');
  const handle=()=>{try{const p=JSON.parse(raw);if(!p.apiKey||!p.projectId)throw new Error('apiKey/projectId 없음');localStorage.setItem('fbConfig',JSON.stringify(p));onSave(p);}catch(e){setErr('올바른 JSON이 아닙니다: '+e.message);}};
  return(<div className="center-screen"><div className="card" style={{width:520}}>
    <div style={{fontSize:36,marginBottom:8}}>🎓</div><h1 style={{fontSize:20,fontWeight:700,marginBottom:4}}>수시·정시 상담 관리</h1>
    <p style={{color:'var(--gray-500)',fontSize:13,marginBottom:20}}>Firebase 설정을 입력하세요</p>
    <textarea value={raw} onChange={e=>setRaw(e.target.value)} placeholder={'{\n  "apiKey": "...",\n  "projectId": "...",\n  ...\n}'} style={{width:'100%',height:160,fontFamily:'monospace',fontSize:11,resize:'vertical',marginBottom:10}}/>
    {err&&<p style={{color:'var(--danger)',fontSize:12,marginBottom:10}}>⚠ {err}</p>}
    <button className="btn-primary" onClick={handle} style={{width:'100%',borderRadius:8,fontSize:14}}>설정 저장 및 시작 →</button>
  </div></div>);}

/* ── Login Screen ── */
function LoginScreen({projectId}){
  const [mode,setMode]=useState('select');const [sNum,setSNum]=useState('');const [pw,setPw]=useState('');const [loading,setLoading]=useState(false);const [err,setErr]=useState('');
  const teacherLogin=async()=>{setLoading(true);setErr('');
    try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      if(!r.user.email?.endsWith('@ggh.goe.go.kr')){await auth.signOut();setErr('학교 계정(@ggh.goe.go.kr)으로만 로그인할 수 있습니다.');setLoading(false);}}
    catch(e){setErr('로그인 실패: '+e.message);setLoading(false);}};
  const studentLogin=async()=>{if(!sNum.trim()||!pw.trim()){setErr('학번과 비밀번호를 입력하세요');return;}setLoading(true);setErr('');
    try{await auth.signInWithEmailAndPassword(sEmail(sNum.trim(),projectId),pw);}
    catch(e){setErr('학번 또는 비밀번호가 올바르지 않습니다');setLoading(false);}};

  if(mode==='select')return(<div className="center-screen"><div className="card" style={{width:400,textAlign:'center'}}>
    <div style={{fontSize:48,marginBottom:12}}>🎓</div><h1 style={{fontSize:22,fontWeight:700,marginBottom:4}}>수시·정시 상담 관리</h1>
    <p style={{color:'var(--gray-500)',fontSize:13,marginBottom:28}}>양주백석고 3학년부</p>

      <button onClick={()=>setMode('teacher')} style={{padding:'14px',background:'linear-gradient(135deg,#5b6cf8,#8b5cf6)',color:'white',fontWeight:700,fontSize:15,borderRadius:10}}>👩‍🏫 선생님 로그인</button>

    </div>
  </div></div>);
  if(mode==='teacher')return(<div className="center-screen"><div className="card" style={{width:360,textAlign:'center'}}>
    <button onClick={()=>setMode('select')} style={{background:'none',color:'var(--gray-400)',fontSize:12,marginBottom:16,padding:0}}>← 뒤로</button>

      {loading?'로그인 중...':'Google 계정으로 로그인'}

    {err&&<p style={{color:'var(--danger)',fontSize:12,marginTop:8}}>{err}</p>}
  </div></div>);
  return(<div className="center-screen"><div className="card" style={{width:360}}>
    <button onClick={()=>setMode('select')} style={{background:'none',color:'var(--gray-400)',fontSize:12,marginBottom:16,padding:0}}>← 뒤로</button>

/* ── Bulk Account Modal ── */
function BulkAccountModal({students,cls,projectId,onClose}){
  const [phase,setPhase]=useState('ready');const [progress,setProgress]=useState(0);const [results,setResults]=useState([]);const [errors,setErrors]=useState([]);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const run=async()=>{
    setPhase('running');const newResults=[];const newErrors=[];
    const toCreate=students.filter(s=>!s.authUid&&s.studentNumber);
    for(let i=0;i<toCreate.length;i++){
      const s=toCreate[i];const pw=genPw();const email=sEmail(s.studentNumber,projectId);
      let retries=3;
      while(retries>0){
        try{
          const secApp=firebase.initializeApp(FB_CONFIG,'sec_'+Date.now());const secAuth=secApp.auth();
          const cred=await secAuth.createUserWithEmailAndPassword(email,pw);const authUid=cred.user.uid;
          await secAuth.signOut();try{await secApp.delete();}catch(e){}
          await db.collection('studentAccounts').doc(s.studentNumber).set({uid:authUid,studentNumber:s.studentNumber,name:s.name,cls,password:pw,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
          await clsRef(cls).collection('students').doc(s.studentNumber).update({authUid});
          newResults.push({...s,pw,authUid});retries=0;
        }catch(e){
          if(e.code==='auth/email-already-in-use'){newResults.push({...s,pw:'(기존계정)',authUid:'exists'});retries=0;}
          else if(e.code==='auth/too-many-requests'){retries--;if(retries>0)await sleep(5000);else newErrors.push({name:s.name,studentNumber:s.studentNumber,err:'rate limit'});}
          else{newErrors.push({name:s.name,studentNumber:s.studentNumber,err:e.message});retries=0;}
        }
      }
      setProgress(Math.round((i+1)/toCreate.length*100));
      if(i<toCreate.length-1)await sleep(1200);
    }
    setResults(newResults);setErrors(newErrors);setPhase('done');};

  const printNew=()=>openPrintWindow(results.filter(r=>r.pw&&r.pw!=='(기존계정)'),cls);

  return(<div className="modal-bg"><div className="modal">
    <h3 style={{fontSize:16,fontWeight:700,marginBottom:4}}>🔑 전체 계정 일괄 생성</h3>
    <p style={{color:'var(--gray-500)',fontSize:13,marginBottom:16}}>3학년 {cls}반 · 계정 없는 학생 {students.filter(s=>!s.authUid).length}명</p>
    {phase==='ready'&&(<><div style={{background:'#fef9c3',border:'1px solid #fde68a',borderRadius:8,padding:14,marginBottom:16,fontSize:12,color:'#854d0e',lineHeight:1.8}}>
      ⚠ 계정마다 1.2초 간격으로 생성됩니다. 창을 닫지 마세요.<br/>완료 후 인쇄 버튼으로 계정 카드를 출력할 수 있습니다.
    </div>
    <div style={{display:'flex',gap:8}}><button onClick={run} style={{flex:1,padding:'12px',background:'linear-gradient(135deg,#5b6cf8,#8b5cf6)',color:'white',fontWeight:700,fontSize:14,borderRadius:8}}>✨ 계정 생성 시작</button><button onClick={onClose} className="btn-ghost" style={{padding:'12px 16px'}}>취소</button></div></>)}
    {phase==='running'&&(<div style={{textAlign:'center',padding:'20px 0'}}>
      <div style={{fontSize:32,marginBottom:8}}>⏳</div>
      <p style={{fontSize:14,fontWeight:600,marginBottom:12}}>계정 생성 중... {progress}%</p>
      <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}/></div>
      <p style={{fontSize:12,color:'var(--gray-400)',marginTop:8}}>예상 소요시간: 약 {Math.ceil(students.filter(s=>!s.authUid).length*1.2/60)}분 · 창을 닫지 마세요.</p>
    </div>)}
    {phase==='done'&&(<>
      <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:8,padding:14,marginBottom:12}}>
        <p style={{fontWeight:700,color:'#15803d',marginBottom:4}}>✅ 완료! {results.length}명 처리됨</p>
        {errors.length>0&&<p style={{fontSize:12,color:'var(--danger)'}}>⚠ 오류 {errors.length}건 (5~10분 후 재시도)</p>}
      </div>
      {errors.length>0&&<div style={{background:'#fef2f2',borderRadius:8,padding:12,marginBottom:12,fontSize:11,maxHeight:80,overflowY:'auto'}}>{errors.map((e,i)=><div key={i}>{e.name}({e.studentNumber}): {e.err}</div>)}</div>}
      <div style={{display:'flex',gap:8}}>
        <button onClick={printNew} style={{flex:1,padding:'12px',background:'#0f766e',color:'white',fontWeight:700,fontSize:14,borderRadius:8}}>🖨️ 신규 계정 카드 인쇄</button>
        <button onClick={onClose} className="btn-ghost" style={{padding:'12px 16px'}}>닫기</button>
      </div>
    </>)}
  </div></div>);}

/* ── Student Detail ── */
function StudentDetail({student,onSave,onBack,cls,isTeacher}){
  const [data,setData]=useState(student);const [saving,setSaving]=useState(false);const [status,setStatus]=useState('idle');
  useEffect(()=>{setData(student);setStatus('idle');},[student.studentNumber]);
  const update=(k,v)=>setData(p=>({...p,[k]:v}));
  const handleSave=async()=>{setSaving(true);setStatus('saving');try{await onSave(data);setStatus('saved');setTimeout(()=>setStatus('idle'),2500);}catch(e){setStatus('error');alert('저장 실패: '+e.message);}finally{setSaving(false);}};
  const updateSusi=(idx,e)=>setData(d=>{const l=[...d.susiList];l[idx]=e;return{...d,susiList:l};});
  const deleteSusi=idx=>setData(d=>({...d,susiList:d.susiList.filter((_,i)=>i!==idx)}));
  const addSusi=()=>setData(d=>({...d,susiList:[...(d.susiList||[]),defSusi()]}));
  const btnCfg={idle:{label:'💾 저장',bg:'#3b82f6'},saving:{label:'저장 중...',bg:'#94a3b8'},saved:{label:'✓ 저장 완료',bg:'#10b981'},error:{label:'⚠ 실패',bg:'#ef4444'}}[status];
  return(<div style={{minHeight:'100vh',background:'var(--gray-50)'}}>
    <div className="detail-header no-print">
      <button className="btn-ghost" onClick={onBack}>← 목록으로</button>
      <div><span style={{fontSize:15,fontWeight:700}}>{data.name||'이름 없음'}</span><span style={{fontSize:12,color:'var(--gray-500)',marginLeft:8}}>학번 {data.studentNumber}</span></div>
      <div style={{marginLeft:'auto',display:'flex',gap:8}}>
        {isTeacher&&<button onClick={()=>window.print()} className="btn-teal">🖨️ 인쇄</button>}
        <button onClick={handleSave} disabled={saving} style={{fontWeight:700,padding:'7px 22px',fontSize:13,borderRadius:6,background:btnCfg.bg,color:'white'}}>{btnCfg.label}</button>
      </div>
    </div>
    <div className="screen-content" style={{maxWidth:1100,margin:'0 auto',padding:'16px 20px'}}>
      {!isTeacher&&<div style={{background:'#fef9c3',border:'1px solid #fde68a',borderRadius:8,padding:12,marginBottom:12,fontSize:12,color:'#854d0e'}}>💡 대학 조사 내용을 입력하고 <strong>저장</strong>을 눌러주세요.</div>}
      <div className="section-box" style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div><div className="field-label">번호</div><input value={data.no||''} readOnly style={{width:50,background:'var(--gray-50)'}}/></div>
        <div><div className="field-label">학번</div><input value={data.studentNumber||''} readOnly style={{width:90,background:'var(--gray-50)'}}/></div>
        <div><div className="field-label">이름</div><input value={data.name||''} readOnly style={{width:90,background:'var(--gray-50)'}}/></div>
        {isTeacher&&<><div><div className="field-label">상담일자</div><input type="date" value={data.counselingDate||''} onChange={e=>update('counselingDate',e.target.value)}/></div>
        <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,fontWeight:600,color:data.completed?'var(--success)':'var(--gray-500)',cursor:'pointer',alignSelf:'flex-end',paddingBottom:5}}>
          <input type="checkbox" checked={!!data.completed} onChange={e=>update('completed',e.target.checked)}/>상담 완료</label>
        <div style={{flex:1,minWidth:120}}><div className="field-label">수시 메모</div><input value={data.susiMemo||''} onChange={e=>update('susiMemo',e.target.value)} style={{width:'100%'}}/></div>
        <div style={{flex:1,minWidth:120}}><div className="field-label">정시 메모</div><input value={data.jungsiMemo||''} onChange={e=>update('jungsiMemo',e.target.value)} style={{width:'100%'}}/></div>
        <div style={{flex:1.5,minWidth:140}}><div className="field-label">특이사항</div><input value={data.specialNote||''} onChange={e=>update('specialNote',e.target.value)} style={{width:'100%'}}/></div></>}
        {!isTeacher&&<div style={{flex:1,minWidth:200}}><div className="field-label">메모 (궁금한 점 등)</div><input value={data.studentNote||''} onChange={e=>update('studentNote',e.target.value)} style={{width:'100%'}}/></div>}
      </div>

/* ── Teacher Dashboard ── */
function TeacherDashboard({user,onLogout}){
  const [currentCls,setCurrentCls]=useState(null);
  const [students,setStudents]=useState([]);
  const [loading,setLoading]=useState(false);
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('전체');
  const [bulkModal,setBulkModal]=useState(false);
  const [acctModal,setAcctModal]=useState(null);
  const [projectId,setProjectId]=useState('');
  const [teacherName,setTeacherName]=useState('');

  useEffect(()=>{
    const cfg=localStorage.getItem('fbConfig');if(cfg){try{setProjectId(JSON.parse(cfg).projectId);}catch(e){}}
    // Restore last viewed class
    const lastCls=localStorage.getItem('lastCls');
    if(lastCls)setCurrentCls(parseInt(lastCls));
    else setCurrentCls(1);
  },[]);

  useEffect(()=>{
    if(!currentCls)return;
    localStorage.setItem('lastCls',String(currentCls));
    setLoading(true);setStudents([]);setSearch('');
    const unsub=clsRef(currentCls).collection('students').orderBy('no').onSnapshot(async snap=>{
      if(snap.empty){
        // 1) 기존 teachers/{uid}/students 경로에서 이전 데이터 찾기
        const prefix=`3${String(currentCls).padStart(2,'0')}`;
        const oldSnap=await db.collection('teachers').doc(user.uid).collection('students')
          .orderBy('studentNumber').startAt(prefix+'00').endAt(prefix+'99').get();
        if(!oldSnap.empty){
          // 기존 데이터 → 새 경로로 이전
          const batch=db.batch();
          oldSnap.docs.forEach(doc=>batch.set(clsRef(currentCls).collection('students').doc(doc.id),doc.data()));
          await batch.commit();
        }else{
          // 아예 없으면 기본 학생 명단으로 시딩
          const seed=STUDENT_DATA.find(c=>c.cls===currentCls);
          if(seed){const batch=db.batch();seed.students.forEach(s=>{batch.set(clsRef(currentCls).collection('students').doc(s.studentNumber),{...defStudent(s),createdAt:firebase.firestore.FieldValue.serverTimestamp()});});await batch.commit();}
        }
      }else{
        setStudents(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);
      }
    },err=>{console.error(err);setLoading(false);});
    return()=>unsub();
  },[currentCls]);

  const saveStudent=async s=>{
    const{id,...data}=s;
    await clsRef(currentCls).collection('students').doc(s.studentNumber).set({...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    setStudents(prev=>prev.map(st=>st.studentNumber===s.studentNumber?{...st,...data}:st));};

  const printAllAccounts=async()=>{
    const withAcct=students.filter(s=>s.authUid&&s.authUid!=='exists');
    if(withAcct.length===0){alert('계정이 있는 학생이 없습니다.');return;}
    const docs=await Promise.all(withAcct.map(s=>db.collection('studentAccounts').doc(s.studentNumber).get()));
    const cards=withAcct.map((s,i)=>({...s,pw:docs[i].exists?docs[i].data().password:'—'}));
    openPrintWindow(cards,currentCls);};

  const resetAuthUids=async()=>{
    if(!window.confirm('authUid를 초기화하시겠습니까?\n(Firebase Auth 계정 삭제 후 사용하세요)'))return;
    const batch=db.batch();
    students.forEach(s=>{batch.update(clsRef(currentCls).collection('students').doc(s.studentNumber),{authUid:firebase.firestore.FieldValue.delete()});});
    await batch.commit();alert('초기화 완료!');};

  if(selected){
    const live=students.find(s=>s.studentNumber===selected.studentNumber)||selected;
    return<StudentDetail student={live} onSave={saveStudent} onBack={()=>setSelected(null)} cls={currentCls} isTeacher={true}/>;
  }

  const filtered=students.filter(s=>{
    const q=search.trim();
    if(q&&!s.name?.includes(q)&&!s.studentNumber?.includes(q))return false;
    if(filter==='완료')return!!s.completed;if(filter==='미완료')return!s.completed;
    if(filter==='계정있음')return!!s.authUid;if(filter==='계정없음')return!s.authUid;
    return true;});
  const done=students.filter(s=>s.completed).length;
  const pct=students.length>0?Math.round(done/students.length*100):0;
  const withAcct=students.filter(s=>s.authUid).length;

  return(<div style={{minHeight:'100vh',background:'var(--gray-50)'}}>
    <div className="header"><div style={{maxWidth:1300,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <h1 style={{fontSize:18,fontWeight:700}}>🎓 수시·정시 상담 관리 <span style={{fontSize:12,opacity:.7}}>선생님</span></h1>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <input value={teacherName} onChange={e=>setTeacherName(e.target.value)} placeholder="이름 입력" style={{width:90,background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',color:'white',padding:'4px 8px',borderRadius:5,fontSize:12}}/>
          <span style={{fontSize:12,opacity:.75}}>{user.email}</span>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.2)',color:'white',padding:'5px 12px',fontSize:12}}>로그아웃</button>
        </div>
      </div>
      {/* 반 선택 탭 */}
      <div className="cls-tabs">
        {[1,2,3,4,5,6,7,8,9].map(n=>(
          <button key={n} className={`cls-tab ${currentCls===n?'active':''}`} onClick={()=>setCurrentCls(n)}>
            {n}반
          </button>))}
      </div>
    </div></div>

    <div className="toolbar">
      <div style={{fontSize:13,fontWeight:600,color:'var(--gray-700)'}}>
        3학년 {currentCls}반 · {students.length}명
        <span style={{fontSize:12,fontWeight:400,color:'var(--gray-400)',marginLeft:8}}>완료 {done}명 ({pct}%) · 계정 {withAcct}명</span>
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 이름 또는 학번" style={{width:180}}/>
      <div style={{display:'flex',gap:4}}>
        {['전체','완료','미완료','계정있음','계정없음'].map(f=><button key={f} className={`tab ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>)}
      </div>
      <div style={{marginLeft:'auto',display:'flex',gap:6}}>
        <button onClick={printAllAccounts} style={{background:'#0f766e',color:'white',fontWeight:600,padding:'7px 12px',fontSize:12,borderRadius:6}}>🖨️ 계정카드 인쇄</button>
        <button onClick={()=>setBulkModal(true)} style={{background:'#7c3aed',color:'white',fontWeight:700,padding:'7px 14px',fontSize:12,borderRadius:6}}>🔑 계정 생성 ({students.filter(s=>!s.authUid).length}명)</button>
        <details style={{display:'inline'}}><summary style={{background:'var(--gray-200)',color:'var(--gray-500)',padding:'7px 10px',fontSize:11,borderRadius:6,cursor:'pointer',listStyle:'none'}}>⚙</summary>
          <div style={{position:'absolute',right:24,background:'white',border:'1px solid var(--gray-200)',borderRadius:8,padding:8,boxShadow:'0 4px 12px rgba(0,0,0,.1)',zIndex:100}}>
            <button onClick={resetAuthUids} style={{background:'#fef2f2',color:'#dc2626',fontWeight:600,padding:'8px 14px',fontSize:12,borderRadius:6,width:'100%'}}>🔄 authUid 초기화 (Auth 계정 삭제 후 사용)</button>
          </div>
        </details>
      </div>
    </div>

    {loading?(<div className="empty-state"><div style={{fontSize:32,marginBottom:8}}>⏳</div>불러오는 중...</div>)
    :(<div className="student-grid">{filtered.map(s=>{
      const sc=(s.susiList||[]).filter(e=>e.univ).length;
      return(<div key={s.studentNumber} className={`student-card ${s.completed?'completed':''}`} onClick={()=>setSelected(s)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div><span style={{fontSize:11,color:'var(--gray-400)',display:'block'}}>{s.no}번 · {s.studentNumber}{s.note==='위탁'?<span style={{color:'var(--warning)',marginLeft:4}}>위탁</span>:''}</span><span style={{fontSize:15,fontWeight:700}}>{s.name}</span></div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2}}>
            {s.completed&&<span className="badge badge-green">완료</span>}
            {s.authUid?<span className="badge badge-blue">계정✓</span>:<span className="badge badge-gray">계정없음</span>}
          </div>
        </div>
        {s.grades?.jeonGwaGyo?(
          <div style={{display:'flex',gap:3,marginBottom:6}}>
            {[['전교',s.grades?.jeonGwaGyo],['국수영사',s.grades?.guksuYeongSa],['수시',sc+'개']].map(([l,v],i)=>(
              <div key={l} style={{flex:1,background:'var(--gray-50)',borderRadius:4,padding:'3px 0',textAlign:'center'}}>
                <div style={{fontSize:10,color:'var(--gray-400)'}}>{l}</div>
                <div style={{fontSize:13,fontWeight:700,color:i===2?'#8b5cf6':'var(--primary)'}}>{v||'-'}</div>
              </div>))}
          </div>):(<div style={{fontSize:11,color:'var(--gray-300)',marginBottom:6,padding:'5px',textAlign:'center',background:'var(--gray-50)',borderRadius:4}}>성적 미입력</div>)}
        {s.counselingDate&&<p style={{fontSize:10,color:'var(--gray-400)',marginBottom:4}}>📅 {s.counselingDate}</p>}
        {s.authUid&&<button onClick={e=>{e.stopPropagation();setAcctModal(s);}} style={{width:'100%',padding:'4px',background:'#ede9fe',color:'#6d28d9',fontWeight:600,fontSize:11,borderRadius:5,marginTop:4}}>🔑 계정보기 / 비번확인</button>}
      </div>);})}
    </div>)}

    {bulkModal&&<BulkAccountModal students={students} cls={currentCls} projectId={projectId} onClose={()=>setBulkModal(false)}/>}
    {acctModal&&<AccountInfoModal student={acctModal} projectId={projectId} onClose={()=>setAcctModal(null)}/>}
  </div>);}

/* ── Student Dashboard ── */
function StudentDashboard({user,onLogout}){
  const [studentDoc,setStudentDoc]=useState(null);const [cls,setCls]=useState(null);const [loading,setLoading]=useState(true);
  useEffect(()=>{
    const find=async()=>{
      const snap=await db.collection('studentAccounts').where('uid','==',user.uid).limit(1).get();
      if(snap.empty){setLoading(false);return;}
      const acct=snap.docs[0].data();setCls(acct.cls);
      const sSnap=await clsRef(acct.cls).collection('students').where('authUid','==',user.uid).limit(1).get();
      if(!sSnap.empty)setStudentDoc({id:sSnap.docs[0].id,...sSnap.docs[0].data()});
      setLoading(false);};
    find();
  },[user.uid]);
  const saveStudent=async s=>{
    if(!cls)return;
    await clsRef(cls).collection('students').doc(s.studentNumber).set({...s,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    setStudentDoc(s);};
  if(loading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--gray-400)'}}>로딩 중...</div>;
  if(!studentDoc)return(<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{textAlign:'center',color:'var(--gray-500)'}}><div style={{fontSize:48,marginBottom:12}}>😅</div><p style={{fontSize:16,fontWeight:600,marginBottom:8}}>학생 정보를 찾을 수 없습니다</p><p style={{fontSize:13,marginBottom:20}}>선생님께 계정 연결을 요청하세요</p><button onClick={onLogout} className="btn-ghost">로그아웃</button></div></div>);
  return(<div style={{minHeight:'100vh',background:'var(--gray-50)'}}>
    <div style={{background:'linear-gradient(135deg,#f59e0b,#f97316)',color:'white',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div><span style={{fontSize:16,fontWeight:700}}>📚 내 수시·정시 상담표</span><span style={{fontSize:12,opacity:.85,marginLeft:10}}>3학년 {cls}반</span></div>
      <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:12,opacity:.85}}>{studentDoc.name} ({studentDoc.studentNumber})</span><button onClick={onLogout} style={{background:'rgba(255,255,255,.2)',color:'white',padding:'5px 12px',fontSize:12,borderRadius:5}}>로그아웃</button></div>
    </div>
    <StudentDetail student={studentDoc} onSave={saveStudent} onBack={()=>{}} cls={cls} isTeacher={false}/>
  </div>);}

/* ── App Root ── */
function App(){
  const [screen,setScreen]=useState('loading');const [user,setUser]=useState(null);const [role,setRole]=useState(null);const [projectId,setProjectId]=useState('');
  useEffect(()=>{
    const saved=localStorage.getItem('fbConfig');
    if(saved){try{const cfg=JSON.parse(saved);initFirebase(cfg);setProjectId(cfg.projectId);
      const unsub=auth.onAuthStateChanged(u=>{
        if(u){const isGoogle=u.providerData.some(p=>p.providerId==='google.com');setRole(isGoogle?'teacher':'student');setUser(u);setScreen('app');}
        else{setUser(null);setRole(null);setScreen('login');}});
      return()=>unsub();}catch(e){localStorage.removeItem('fbConfig');setScreen('config');}}
    else setScreen('config');
  },[]);
  const handleConfig=cfg=>{initFirebase(cfg);setProjectId(cfg.projectId);auth.onAuthStateChanged(u=>{if(u){const isGoogle=u.providerData.some(p=>p.providerId==='google.com');setRole(isGoogle?'teacher':'student');setUser(u);setScreen('app');}else{setUser(null);setRole(null);setScreen('login');}});};
  const handleLogout=()=>{auth.signOut();setScreen('login');setUser(null);setRole(null);};
  if(screen==='loading')return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--gray-400)'}}>🎓 로딩 중...</div>;
  if(screen==='config')return<ConfigScreen onSave={handleConfig}/>;
  if(screen==='login')return<LoginScreen projectId={projectId}/>;
  if(screen==='app'&&role==='teacher')return<TeacherDashboard user={user} onLogout={handleLogout}/>;
  if(screen==='app'&&role==='student')return<StudentDashboard user={user} onLogout={handleLogout}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
